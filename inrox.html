<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uszer378 Soundboard - High Power Edition</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --danger: #ef4444;
            --text: #f8fafc;
            --panel-bg: rgba(30, 41, 59, 0.95);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #status {
            font-size: 0.85rem;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Sticky Control Panel */
        .master-controls {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 20px;
            z-index: 1000;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .control-label-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 5px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent);
            height: 8px;
            border-radius: 5px;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stop-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .stop-btn:hover { 
            background: #f87171;
            transform: translateY(-1px);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            padding-top: 10px;
        }

        .sound-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100px;
        }

        .sound-card:hover {
            border-color: var(--accent);
            background: #2d3e5a;
            transform: translateY(-3px);
        }

        .sound-name {
            font-weight: 500;
            color: var(--accent);
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border-left-color: var(--accent);
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .master-controls { width: 95%; top: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Soundboard</h1>
        <div id="status">Connecting...</div>
    </div>

    <div class="master-controls">
        <div class="control-group">
            <div class="control-label-wrapper">
                <label>Sound Booster</label>
                <div class="value-display" id="gainValue">100%</div>
            </div>
            <input type="range" id="gainSlider" min="0" max="6" step="0.1" value="1">
        </div>

        <button class="stop-btn" onclick="stopAll()">
            <span>🛑</span> STOP ALL SOUNDS
        </button>
    </div>

    <div id="loading" class="spinner" style="display:none;"></div>
    <div class="grid" id="soundboard"></div>

    <script>
        const CONFIG = {
            user: 'uszer378',
            repo: 'sounds',
            folder: 'sounds',
            branch: 'main'
        };

        let audioCtx;
        let masterGain;
        let activeSources = [];

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = document.getElementById('gainSlider').value;
            masterGain.connect(audioCtx.destination);
        }

        document.getElementById('gainSlider').oninput = (e) => {
            const val = parseFloat(e.target.value);
            if (masterGain) masterGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
            document.getElementById('gainValue').innerText = Math.round(val * 100) + "%";
        };

        async function playSound(url) {
            initAudio();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                
                source.connect(masterGain);
                source.start(0);
                
                activeSources.push(source);
                source.onended = () => {
                    activeSources = activeSources.filter(s => s !== source);
                };
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        async function fetchFiles() {
            const board = document.getElementById('soundboard');
            const loader = document.getElementById('loading');
            const status = document.getElementById('status');
            
            loader.style.display = 'block';
            const apiUrl = `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.folder}?ref=${CONFIG.branch}`;
            
            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("GitHub path error");
                const files = await res.json();
                const mp3s = files.filter(f => f.name.toLowerCase().endsWith('.mp3'));

                loader.style.display = 'none';
                status.innerText = `${mp3s.length} sounds loaded from GitHub`;

                mp3s.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'sound-card';
                    const name = file.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
                    card.innerHTML = `<div style="font-size:1.2rem; margin-bottom:5px;">🔊</div><div class="sound-name">${name}</div>`;
                    
                    const url = `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.folder}/${encodeURIComponent(file.name)}`;
                    card.onclick = () => playSound(url);
                    board.appendChild(card);
                });
            } catch (err) {
                loader.style.display = 'none';
                status.innerText = "Error: " + err.message;
            }
        }

        function stopAll() {
            activeSources.forEach(s => {
                try { s.stop(); } catch(e) {}
            });
            activeSources = [];
        }

        window.onload = fetchFiles;
    </script>
</body>
</html>
